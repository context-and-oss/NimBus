name: CRM ERP end-to-end

on:
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * *'

permissions:
  contents: read

concurrency:
  group: crm-erp-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  crm-erp-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: 'true'
      DOTNET_ENVIRONMENT: Development
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      ASPIRE_CLI_TELEMETRY_OPTOUT: 'true'
      ASPIRE_CLI_START_TIMEOUT: '600'
      NIMBUS_SB_EMULATOR: 'true'
      NIMBUS_STORAGE_PROVIDER: sqlserver
      E2E__Enabled: 'true'
      E2E_APPHOST: ${{ github.workspace }}/samples/CrmErpDemo/CrmErpDemo.AppHost/CrmErpDemo.AppHost.csproj
    defaults:
      run:
        shell: bash
        working-directory: samples/CrmErpDemo/e2e
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: samples/CrmErpDemo/e2e/package-lock.json

      - name: Install and validate test tools
        run: |
          npm ci
          npm run typecheck
          npm run test:report
          mkdir -p artifacts
          npx playwright test --list --reporter=json > artifacts/catalog.json
          npx playwright install --with-deps chromium

      - name: Install demo prerequisites
        run: |
          # The Aspire CLI has to match the AppHost's Aspire version, so read it from the
          # AppHost project instead of pinning it here. A CLI one minor behind still reports
          # the AppHost as started, then cannot find it: every later step fails with
          # "No AppHost is currently running" and no scenario runs.
          aspire_version="$(grep -oE 'Aspire\.AppHost\.Sdk/[0-9]+\.[0-9]+\.[0-9]+' "$E2E_APPHOST" | head -n 1 | cut -d/ -f2 || true)"
          if [ -z "$aspire_version" ]; then
            echo "::error::Could not read the Aspire.AppHost.Sdk version from $E2E_APPHOST"
            exit 1
          fi
          echo "Aspire version of the AppHost: $aspire_version"
          dotnet tool install --global Aspire.Cli --version "$aspire_version"
          npm install --global azure-functions-core-tools@4.14.0
          export SSL_CERT_DIR="$HOME/.aspnet/dev-certs/trust:${SSL_CERT_DIR:-/usr/lib/ssl/certs}"
          echo "SSL_CERT_DIR=$SSL_CERT_DIR" >> "$GITHUB_ENV"
          dotnet dev-certs https --trust
          dotnet dev-certs https --check --trust
          docker info
          aspire --version
          func --version

      - name: Create ephemeral test key
        run: |
          e2e_key="$(openssl rand -hex 32)"
          echo "::add-mask::$e2e_key"
          echo "E2E__Key=$e2e_key" >> "$GITHUB_ENV"

      - name: Restore demo web dependencies
        run: |
          npm ci --prefix ../Crm.Web
          npm ci --prefix ../Erp.Web
          npm ci --prefix ../../../src/NimBus.WebApp/ClientApp

      - name: Build demo
        timeout-minutes: 15
        run: dotnet build "$E2E_APPHOST" --configuration Debug --maxcpucount:2

      - name: Start isolated demo
        id: start
        timeout-minutes: 12
        run: aspire start --apphost "$E2E_APPHOST" --isolated --no-build --non-interactive

      - name: Run all CRM and ERP scenarios
        timeout-minutes: 25
        run: npm run test:live

      - name: Generate result visualization and check complete pass
        if: always()
        run: node scripts/report-results.mjs

      - name: Collect bounded application logs
        if: always() && steps.start.outcome != 'skipped'
        timeout-minutes: 3
        run: node scripts/collect-diagnostics.mjs

      - name: Stop isolated demo
        if: always() && steps.start.outcome != 'skipped'
        timeout-minutes: 2
        run: aspire stop --apphost "$E2E_APPHOST" --non-interactive

      - name: Upload results and failure evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: crm-erp-e2e-${{ github.run_number }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            samples/CrmErpDemo/e2e/artifacts/
            samples/CrmErpDemo/e2e/playwright-report/
            samples/CrmErpDemo/e2e/test-results/
