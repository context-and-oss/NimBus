# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  # The org ruleset requires PR branches to be up to date with master. The master merge
  # queue meets that by testing each queued PR on top of master, so "ci" must also run
  # for merge groups or queued PRs never get the check.
  merge_group:

jobs:
  build:
    # The context-and-oss org ruleset requires a status check named exactly "ci".
    name: ci

    runs-on: ubuntu-latest

    services:
      # SQL Server service container for the SQL Server message store conformance suite.
      # Tests skip themselves when NIMBUS_SQL_TEST_CONNECTION is unset, so this only
      # adds runtime cost when the SQL provider needs real coverage in CI.
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'YourStrong@Passw0rd'
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P YourStrong@Passw0rd -No -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P YourStrong@Passw0rd -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s

      # Cosmos DB emulator (vNext) for the Cosmos message store conformance suite.
      # Unlike SQL, this one is NOT optional: NIMBUS_COSMOS_TEST_REQUIRED below turns a
      # missing/unreachable emulator into a failing run instead of a silently skipped
      # suite, so a green build actually means the Cosmos provider conforms.
      cosmos:
        image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-latest
        env:
          PROTOCOL: https
        ports:
          - 8081:8081
          - 8080:8080

    env:
      NIMBUS_SQL_TEST_CONNECTION: "Server=localhost,1433;User ID=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;Database=master"
      # The emulator's well-known public key; DisableServerCertificateValidation replaces
      # importing its self-signed certificate into the runner's trust store.
      NIMBUS_COSMOS_TEST_CONNECTION: "AccountEndpoint=https://localhost:8081/;AccountKey=C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw==;DisableServerCertificateValidation=True;"
      # The emulator container exposes only the gateway; Direct mode would try to reach
      # partition addresses that are not published.
      NIMBUS_COSMOS_TEST_GATEWAY: "1"
      NIMBUS_COSMOS_TEST_REQUIRED: "1"

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Restore dependencies
      # Restore in Release: NuGet audit findings (NU1901-NU1904) are raised during
      # restore and are only promoted to errors under Release's TreatWarningsAsErrors.
      # A Debug restore records them as warnings that the --no-restore build replays.
      run: dotnet restore src/NimBus.slnx -p:Configuration=Release
    - name: Prepare the Aspire CLI bundle
      # CrmErpDemo.AppHost and DynamicsBcDemo.AppHost set AspireUseCliBundle. On a runner
      # without the bundle, each runs this same setup into ~/.aspire during the parallel
      # build, and the one that loses the race fails with ASPIRE009. Preparing it once
      # here lets both resolve it. Keep the version in step with Aspire.AppHost.Sdk.
      run: dotnet dnx --yes aspire.cli@13.5.4 -- setup --install-path "$HOME/.aspire"
    - name: Build
      run: dotnet build src/NimBus.slnx --no-restore --configuration Release
    - name: Wait for Cosmos DB emulator
      # The gateway on 8081 answers almost immediately, so it is not a readiness signal;
      # the documented health probe on 8080 is. Probe both schemes so readiness does not
      # itself become a bet on which one the probe endpoint serves.
      run: |
        timeout 300 bash -c 'until curl -sf http://localhost:8080/ready >/dev/null \
          || curl -sfk https://localhost:8080/ready >/dev/null; do sleep 5; done'
    - name: Test
      run: |
        dotnet test src/NimBus.slnx --no-build --configuration Release --verbosity normal \
          --logger trx --results-directory TestResults \
          --collect "Code Coverage;Format=cobertura"
    - name: Resolver and SDK coverage report
      # Informational, not a gate (issue #136): merges the Cobertura files every test
      # project wrote — Resolver and SDK code is exercised from several of them — and
      # publishes the Resolver/SDK summary to the job page plus the full report as an
      # artifact.
      if: always()
      continue-on-error: true
      run: |
        dotnet tool install dotnet-reportgenerator-globaltool --version 5.5.11 --tool-path .tools
        .tools/reportgenerator \
          -reports:"TestResults/**/*.cobertura.xml" \
          -targetdir:CoverageReport \
          -reporttypes:"MarkdownSummaryGithub;HtmlInline" \
          "-assemblyfilters:+NimBus.Resolver;+NimBus.SDK" \
          "-filefilters:-*.g.cs"
        cat CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
    - name: Upload coverage report
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: coverage-resolver-sdk
        path: CoverageReport
        if-no-files-found: ignore
    - name: Cosmos DB conformance must not skip
      # The evidence gate for the Cosmos provider: a suite that skips itself reports green
      # without having conformed to anything. It reads the trx the run above already
      # produced rather than re-running the suite — a second run against the same emulator
      # sees the first run's rows and fails the count-based metrics conformance tests.
      # A solution-wide skip count would not do, because other suites (Service Bus,
      # Identity) legitimately skip; so pick out the Cosmos assembly's own trx.
      if: always()
      run: |
        trx=$(grep -ril --include='*.trx' 'nimbus.messagestore.cosmosdb.tests.dll' TestResults | head -1)
        if [ -z "$trx" ]; then
          echo "::error::No trx found for NimBus.MessageStore.CosmosDb.Tests; the suite did not run at all."
          exit 1
        fi
        skipped=$(grep -o 'outcome="\(NotExecuted\|Inconclusive\|Skipped\)"' "$trx" | wc -l)
        echo "Cosmos results file: $trx"
        echo "Cosmos tests not executed: $skipped"
        if [ "$skipped" != "0" ]; then
          echo "::error::$skipped Cosmos test(s) did not execute; the live conformance suite must run in CI."
          exit 1
        fi
    - name: SQL Server conformance must not skip
      # Same evidence gate for the SQL provider. The Spec 030 stale-write guard lives in the
      # UnresolvedEvents MERGE predicate, so a suite that skipped itself would let a wrong
      # predicate pass CI by being inconclusive rather than by conforming.
      if: always()
      run: |
        trx=$(grep -ril --include='*.trx' 'nimbus.messagestore.sqlserver.tests.dll' TestResults | head -1)
        if [ -z "$trx" ]; then
          echo "::error::No trx found for NimBus.MessageStore.SqlServer.Tests; the suite did not run at all."
          exit 1
        fi
        skipped=$(grep -o 'outcome="\(NotExecuted\|Inconclusive\|Skipped\)"' "$trx" | wc -l)
        echo "SQL Server results file: $trx"
        echo "SQL Server tests not executed: $skipped"
        if [ "$skipped" != "0" ]; then
          echo "::error::$skipped SQL Server test(s) did not execute; the live conformance suite must run in CI."
          exit 1
        fi
