name: Publish NuGet Packages

on:
  push:
    tags:
      - 'v*'

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        # Release, so NuGet audit findings fail the restore; see dotnet.yml.
        run: dotnet restore src/NimBus.slnx -p:Configuration=Release

      - name: Prepare the Aspire CLI bundle
        # Two AppHosts set AspireUseCliBundle and would otherwise race to set the bundle up
        # during the parallel build (ASPIRE009); see dotnet.yml. Keep the version in step
        # with Aspire.AppHost.Sdk.
        run: dotnet dnx --yes aspire.cli@13.5.4 -- setup --install-path "$HOME/.aspire"

      - name: Build
        run: dotnet build src/NimBus.slnx -c Release --no-restore /p:Version=${{ steps.version.outputs.VERSION }}

      - name: Test
        run: dotnet test src/NimBus.slnx -c Release --no-build

      - name: Pack
        run: dotnet pack src/NimBus.slnx -c Release --no-build -o ./nupkgs /p:Version=${{ steps.version.outputs.VERSION }}

      # The deployable applications ship as a payload package (ADR-015) so `nb deploy apps`
      # works without a repository clone. --no-build reuses the binaries that were just
      # tested, which is the point: customers deploy the exact bits this run validated.
      - name: Publish deployable applications
        run: |
          dotnet publish src/NimBus.Resolver/NimBus.Resolver.csproj -c Release --no-build \
            -o ./artifacts/resolver /p:Version=${{ steps.version.outputs.VERSION }}
          dotnet publish src/NimBus.WebApp/NimBus.WebApp.csproj -c Release --no-build \
            -o ./artifacts/webapp /p:Version=${{ steps.version.outputs.VERSION }}

      - name: Package deployable applications
        run: |
          # -X keeps the archives reproducible-ish by dropping extra file attributes.
          (cd ./artifacts/resolver && zip -qrX ../resolver.zip .)
          (cd ./artifacts/webapp && zip -qrX ../webapp.zip .)
          dotnet pack deploy/package/NimBus.Deploy.csproj -o ./nupkgs \
            /p:Version=${{ steps.version.outputs.VERSION }} \
            /p:ArtifactStagingDirectory=$GITHUB_WORKSPACE/artifacts

      - name: Push NuGet packages
        run: dotnet nuget push "./nupkgs/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json

      - name: Push symbol packages
        run: dotnet nuget push "./nupkgs/*.snupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
        continue-on-error: true
