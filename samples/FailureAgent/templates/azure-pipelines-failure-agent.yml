# Template, not active in this repository: an Azure DevOps variant of the NimBus failure agent
# (Spec 044 Phase 4; see docs/failure-agent.md), for adapters generated by the adapter kit, whose
# repositories and trackers live in Azure DevOps.
#
# Needs:
#   - an Azure Resource Manager service connection that signs in as the runner's workload identity
#     (workload identity federation), named in RUNNER_SERVICE_CONNECTION;
#   - variables NIMBUS_MCP_URL and NIMBUS_MCP_SCOPE;
#   - a secret variable ANTHROPIC_API_KEY;
#   - the build service identity allowed to create branches and pull requests, and to contribute to
#     work items, in the adapter repositories only, with branch policies on their default branches.
schedules:
  - cron: "*/30 * * * *"
    displayName: Handle NimBus failures
    branches:
      include: [main]
    always: true

trigger: none

variables:
  RUNNER_SERVICE_CONNECTION: nimbus-failure-agent

jobs:
  - job: handle_failures
    timeoutInMinutes: 50
    pool:
      vmImage: ubuntu-latest
    steps:
      - task: UseDotNet@2
        inputs:
          version: 10.0.x

      - task: NodeTool@0
        inputs:
          versionSpec: 22.x

      - script: npm install --global @anthropic-ai/claude-code
        displayName: Install Claude Code

      - task: AzureCLI@2
        displayName: Run the failure agent
        inputs:
          azureSubscription: $(RUNNER_SERVICE_CONNECTION)
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: dotnet run --project FailureAgent.Runner/FailureAgent.Runner.csproj
        env:
          FailureAgent__McpUrl: $(NIMBUS_MCP_URL)
          FailureAgent__Scope: $(NIMBUS_MCP_SCOPE)
          FailureAgent__WorkingDirectory: $(Agent.TempDirectory)/agent
          FailureAgent__AppendSystemPrompt: Use the az repos and az boards commands for the adapter repositories and their work items.
          AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)
          ANTHROPIC_API_KEY: $(ANTHROPIC_API_KEY)
