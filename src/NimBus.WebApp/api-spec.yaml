                  queueCount:
                    type: integer
                    format: int64
                    nullable: true
                    description: >-
                      Messages in the dead-letter queue of the endpoint's own
                      subscription; null when Service Bus could not be read.
                  matchingQueueCount:
                    type: integer
                    nullable: true
                    description: >-
                      Of queueCount, the messages whose EventId matches a stored
                      dead-lettered event: the ones the delete removes. The rest
                      are left for Admin → Subscriptions → Purge dead letters.
                      Null when Service Bus could not be read.
        '403':
          description: Forbidden
        '404':
          description: Endpoint not found
  '/api/admin/endpoint/{endpointId}/delete-deadlettered':
    parameters:
      - schema:
          type: string
        name: endpointId
        in: path
        required: true
    post:
      summary: Delete all dead-lettered messages for endpoint
      description: >-
        Deletes the stored events with status DeadLettered and completes their
        messages in the dead-letter queue of the endpoint's own subscription,
        matched on the EventId property. Queue messages that match no stored
        event are left for Admin → Subscriptions → Purge dead letters. If the
        queue cannot be read the stored events are kept, so the call can be
        repeated. Succeeded counts queue messages removed plus stored events
        deleted.
      operationId: post-admin-delete-deadlettered
      tags:
        - Admin
      responses:
        '200':
          description: OK
