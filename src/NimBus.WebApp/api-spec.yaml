        required: true
    post:
      summary: Drain both dead-letter queues of a subscription
      description: >-
        Completes every message in the subscription's dead-letter queue and in
        its transfer dead-letter queue. Service Bus never empties these on its
        own. A paused subscription stays paused; if Service Bus refuses the
        receive, the result says so.
      operationId: post-admin-servicebus-subscription-deadletters-purge
      tags:
        - Admin
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationResult'
        '403':
          description: Forbidden
        '404':
          description: Topic or subscription not found
