        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpAccessProblem'
        '403':
          description: Forbidden
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpAccessProblem'
