    post:
      summary: Turn MCP access off now
      description: >-
        Spec 037. Site Owner only; requires the X-NimBus-CSRF antiforgery header. Turns the
        endpoint off on the latest saved policy, whatever revision the caller last read, and
        keeps every other setting. Agents get 503 [Disabled] within 30 seconds.
