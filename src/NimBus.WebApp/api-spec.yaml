      description: >-
        Spec 037. Site Owner only. Returns the saved policy (revision null when nothing was
        saved), the policy this instance enforces, the deployment's read-only MCP settings and
        an antiforgery token for the write operations.
      operationId: get-admin-mcp-settings
      tags:
        - McpAccess
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpAccessState'
        '403':
          description: Forbidden
    put:
      summary: Save the MCP access policy
      description: >-
        Spec 037. Site Owner only; requires the X-NimBus-CSRF antiforgery header. Saves when
        revision matches the stored revision (409 otherwise). A change that widens access
        needs confirmWidening (400 ConfirmationRequired otherwise). Applies to every instance
        within 30 seconds.
      operationId: put-admin-mcp-settings
      tags:
        - McpAccess
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/McpAccessUpdate'
