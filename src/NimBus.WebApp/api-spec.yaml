        '403':
          description: Forbidden
        '404':
          description: Endpoint not found
    delete:
      summary: Clear an endpoint's acknowledgement
      description: Requires Contributor on the endpoint. Succeeds when nothing is acknowledged.
      operationId: delete-monitor-acknowledgement
      tags:
        - Monitor
      responses:
        '204':
          description: Cleared
        '403':
          description: Forbidden
        '404':
          description: Endpoint not found
  /api/agent/catalog:
    get:
      summary: Get agent catalog
      operationId: get-agent-catalog
      tags:
        - Agent
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCatalog'
  /api/agent/event-types:
    post:
      summary: Define or retrieve an event type
      operationId: post-agent-event-types
      tags:
        - Agent
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefineEventTypeRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventTypeInfo'
        '409':
          description: Event type already exists with a different schema
  /api/agent/subscribe:
    post:
      summary: Subscribe to an event type
      operationId: post-agent-subscribe
      tags:
        - Agent
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentSubscribeRequest'
      responses:
        '200':
          description: OK
  /api/agent/receive:
    get:
      summary: Receive the next available event
      operationId: get-agent-receive
      tags:
        - Agent
      parameters:
        - name: eventTypeId
          in: query
          required: false
          schema:
            type: string
        - name: waitSeconds
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentReceivedMessage'
        '204':
          description: No message available in the wait window
  /api/agent/publish:
    post:
      summary: Publish an event
      operationId: post-agent-publish
      tags:
        - Agent
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentPublishRequest'
      responses:
        '200':
          description: OK
        '400':
          description: Payload failed schema validation
        '404':
          description: Unknown eventTypeId
  /api/agent/settle:
    post:
      summary: Settle a received event
      operationId: post-agent-settle
      tags:
        - Agent
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentSettleRequest'
      responses:
        '200':
          description: OK
  /api/access-control:
    get:
      summary: Get the site-wide access-control lists
      operationId: get-access-control
      tags:
        - AccessControl
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessControlSet'
        '403':
          description: Forbidden
  /api/access-control/roles:
    post:
      summary: Grant a site-wide role to an email address or Entra object id
      operationId: post-access-control-role
      tags:
        - AccessControl
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleEntry'
      responses:
        '200':
          description: OK — returns the updated access-control lists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessControlSet'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
    delete:
      summary: Revoke a site-wide role entry
      operationId: delete-access-control-role
      tags:
        - AccessControl
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleEntry'
      responses:
        '200':
          description: OK — returns the updated access-control lists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessControlSet'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
  /api/access-control/me:
    get:
      summary: Get the current user's resolved access
      operationId: get-access-control-me
      tags:
        - AccessControl
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserAccessInfo'
  '/api/access-control/endpoint/{endpointId}':
    parameters:
      - schema:
          type: string
        name: endpointId
        in: path
        required: true
    get:
      summary: Get one endpoint's access-control lists
      operationId: get-endpoint-access-control
      tags:
        - AccessControl
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessControlSet'
        '403':
          description: Forbidden
        '404':
          description: Endpoint not found
  '/api/access-control/endpoint/{endpointId}/roles':
    parameters:
      - schema:
          type: string
        name: endpointId
        in: path
        required: true
    post:
      summary: Grant an endpoint-scoped role (piiReader is site-scoped and rejected)
      operationId: post-endpoint-access-control-role
      tags:
        - AccessControl
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleEntry'
      responses:
        '200':
          description: OK — returns the updated access-control lists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessControlSet'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Endpoint not found
    delete:
      summary: Revoke an endpoint-scoped role entry
      operationId: delete-endpoint-access-control-role
      tags:
        - AccessControl
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleEntry'
      responses:
        '200':
          description: OK — returns the updated access-control lists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessControlSet'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Endpoint not found
  /api/admin/simulation:
    get:
      summary: Traffic simulator status
      description: >-
        Environment gate, settings, config, run state, counters, the last 100 deliveries
        and the endpoints the simulator can publish from or host. Outside an allowed
        environment it still answers, with allowed false and a blockedReason.
      operationId: get-admin-simulation
      tags:
        - Simulation
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationStatus'
        '403':
          description: Forbidden
  /api/admin/simulation/settings:
    put:
      summary: Update the traffic simulator settings
      description: >-
        Enabled flag, auto-stop, the global rate ceiling and the consuming endpoints the
        simulator owns. Ownership cannot change while a run is active (409). Disabling
        stops a run.
      operationId: put-admin-simulation-settings
      tags:
        - Simulation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulationSettings'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationStatus'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationProblem'
        '403':
          description: Forbidden
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationProblem'
  /api/admin/simulation/config:
    put:
      summary: Replace the traffic simulator config
      description: >-
        Speed, publisher rates and per-endpoint failure modes, replaced whole. A running
        simulation picks the change up on its next publish or delivery.
      operationId: put-admin-simulation-config
      tags:
        - Simulation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulationConfig'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationStatus'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationProblem'
        '403':
          description: Forbidden
  /api/admin/simulation/start:
    post:
      summary: Start or resume the traffic simulator
      operationId: post-admin-simulation-start
      tags:
        - Simulation
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationStatus'
        '403':
          description: Forbidden
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationProblem'
  /api/admin/simulation/pause:
    post:
      summary: Pause the traffic simulator
      operationId: post-admin-simulation-pause
      tags:
        - Simulation
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationStatus'
        '403':
          description: Forbidden
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationProblem'
  /api/admin/simulation/stop:
    post:
      summary: Stop the traffic simulator
      description: Stops publishers, drains simulated subscribers within the drain window, then stops them.
      operationId: post-admin-simulation-stop
      tags:
        - Simulation
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationStatus'
        '403':
          description: Forbidden
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationProblem'
components:
  schemas:
    SimulationRunState:
      title: SimulationRunState
      type: string
      enum:
        - stopped
        - running
        - pausing
        - paused
        - stopping
    SimulationBlockReason:
      title: SimulationBlockReason
      type: string
      enum:
        - environmentMissing
        - notAllowed
        - production
    SimulationFailureMode:
      title: SimulationFailureMode
      type: string
      enum:
        - healthy
        - random
        - transient
        - slow
        - poison
        - noHandler
    SimulationDeliveryOutcome:
      title: SimulationDeliveryOutcome
      type: string
      enum:
        - completed
        - threw
        - poisoned
        - unsupported
    SimulationProblem:
      title: SimulationProblem
      type: object
      properties:
        errors:
          type: array
          items:
            type: string
    SimulationSettings:
      title: SimulationSettings
      type: object
      properties:
        enabled:
          type: boolean
        autoStopMinutes:
          type: integer
          description: Minutes after Start before the run stops itself, 1 to 240.
        rateCeilingPerMinute:
          type: integer
          description: Global publish ceiling shared by every publisher loop, 1 to maxRateCeilingPerMinute.
        ownedEndpoints:
          type: array
          description: Consuming endpoints whose handlers the simulator hosts. Every other consuming endpoint is External.
          items:
            type: string
    SimulationEventTypeConfig:
      title: SimulationEventTypeConfig
      type: object
      properties:
        eventTypeId:
          type: string
        enabled:
          type: boolean
        ratePerMinute:
          type: integer
          description: 1 to rateCeilingPerMinute, before the speed multiplier.
    SimulationPublisherConfig:
      title: SimulationPublisherConfig
      type: object
      properties:
        endpointId:
          type: string
        eventTypes:
          type: array
          items:
            $ref: '#/components/schemas/SimulationEventTypeConfig'
    SimulationFailure:
      title: SimulationFailure
      type: object
      properties:
        mode:
          $ref: '#/components/schemas/SimulationFailureMode'
        rate:
          type: integer
          description: Random mode failure probability in percent, 1 to 100.
        failAttempts:
          type: integer
          description: Transient mode failing attempts, 1 to 3.
        latencyMinMs:
          type: integer
        latencyMaxMs:
          type: integer
        exceptionMessage:
          type: string
          nullable: true
        eventTypeIds:
          type: array
          description: Event types the mode applies to. Empty means all consumed types.
          items:
            type: string
        sessionPattern:
          type: string
          nullable: true
          description: Optional glob over the session id. Asterisk and question mark are the only wildcards.
        revertAfterMinutes:
          type: integer
          nullable: true
    SimulationSubscriberConfig:
      title: SimulationSubscriberConfig
      type: object
      properties:
        endpointId:
          type: string
        failure:
          $ref: '#/components/schemas/SimulationFailure'
    SimulationConfig:
      title: SimulationConfig
      type: object
      properties:
        speed:
          type: number
          format: double
          description: One of 0.5, 1, 2, 5, 10 or 20.
        publishers:
          type: array
          items:
            $ref: '#/components/schemas/SimulationPublisherConfig'
        subscribers:
          type: array
          items:
            $ref: '#/components/schemas/SimulationSubscriberConfig'
    SimulationCounters:
      title: SimulationCounters
      type: object
      properties:
        published:
          type: integer
          format: int64
        handledOk:
          type: integer
          format: int64
        handlerErrors:
          type: integer
          format: int64
        poisoned:
          type: integer
          format: int64
        publishErrors:
          type: integer
          format: int64
        abandonedSends:
          type: integer
          format: int64
        throughputPerMinute:
          type: integer
    SimulationDelivery:
      title: SimulationDelivery
      type: object
      properties:
        at:
          type: string
          format: date-time
        endpointId:
          type: string
        eventTypeId:
          type: string
        sessionId:
          type: string
        messageId:
          type: string
        outcome:
          $ref: '#/components/schemas/SimulationDeliveryOutcome'
        attempt:
          type: integer
        latencyMs:
          type: integer
          format: int64
        error:
          type: string
          nullable: true
    SimulationEndpoint:
      title: SimulationEndpoint
      type: object
      properties:
        endpointId:
          type: string
        produces:
          type: array
          items:
            type: string
        consumes:
          type: array
          items:
            type: string
        owned:
          type: boolean
        liveInstanceWarning:
          type: boolean
          description: Advisory. An owned endpoint answered a heartbeat recently while the simulator was not hosting it.
        effectiveMode:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/SimulationFailureMode'
    SimulationStatus:
      title: SimulationStatus
      type: object
      properties:
        allowed:
          type: boolean
        blockedReason:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/SimulationBlockReason'
        environment:
          type: string
          nullable: true
        productionNames:
          type: array
          items:
            type: string
        allowedEnvironments:
          type: array
          items:
            type: string
        enabled:
          type: boolean
        state:
          $ref: '#/components/schemas/SimulationRunState'
        startedAt:
          type: string
          format: date-time
          nullable: true
        autoStopAt:
          type: string
          format: date-time
          nullable: true
        capped:
          type: boolean
        maxRateCeilingPerMinute:
          type: integer
        sessionPrefix:
          type: string
        settings:
          $ref: '#/components/schemas/SimulationSettings'
        config:
          $ref: '#/components/schemas/SimulationConfig'
        counters:
          $ref: '#/components/schemas/SimulationCounters'
        recent:
          type: array
          items:
            $ref: '#/components/schemas/SimulationDelivery'
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/SimulationEndpoint'
    OldEvent:
      type: object
      properties:
        updatedAt:
          type: string
          format: date-time
        eventId:
          type: string
        sessionId:
          type: string
        correlationId:
          type: string
        resolutionStatus:
          type: string
        endpointRole:
          type: string
        endpointId:
          type: string
        retryCount:
          type: string
        messageType:
          type: string
        deadLetterReason:
          type: string
        originatingMessageId:
          type: string
        retryLimit:
          type: string
        originatingMessage:
          $ref: '#/components/schemas/Message'
        reason:
          type: string
    EventDetails:
      title: EventDetails
      type: object
      properties:
        failedMessage:
          $ref: '#/components/schemas/Message'
        originatingMessage:
          $ref: '#/components/schemas/Message'
        eventHistory:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        logEntries:
          type: array
          items:
            $ref: '#/components/schemas/EventLogEntry'
    EventLogEntry:
      title: LogEntry
      type: object
      properties:
        text:
          type: string
        eventType:
          type: string
        to:
          type: string
        from:
          type: string
        eventId:
          type: string
        correlationId:
          type: string
        payload:
          type: string
        sessionId:
          type: string
        timeStamp:
          type: string
          format: date-time
        messageType:
          type: string
        isDeferred:
          type: boolean
        messageId:
          type: string
        severityLevel:
          type: string
          enum:
            - verbose
            - information
            - warning
            - critical
      description: ''
    Message:
      type: object
      title: Message
      properties:
        eventId:
          type: string
        messageId:
          type: string
        originatingMessageId:
          type: string
        parentMessageId:
          type: string
        from:
          type: string
        to:
          type: string
        sessionId:
          type: string
        correlationId:
          type: string
        enqueuedTimeUtc:
          type: string
          format: date-time
        messageType:
          type: string
          enum:
            - unknown
            - eventRequest
            - errorResponse
            - resolutionResponse
            - skipResponse
            - deferralResponse
            - resubmissionRequest
            - retryRequest
            - skipRequest
            - continuationRequest
            - unsupportedRequest
            - pendingHandoffResponse
            - handoffCompletedRequest
            - handoffFailedRequest
        endpointRole:
          type: string
          enum:
            - publisher
            - subscriber
        endpointId:
          type: string
        eventTypeId:
          type: string
        eventContent:
          type: string
        errorContent:
          $ref: '#/components/schemas/MessageErrorContent'
        originatingFrom:
          type: string
        pendingSubStatus:
          type: string
          nullable: true
        handoffReason:
          type: string
          nullable: true
        externalJobId:
          type: string
          nullable: true
        expectedBy:
          type: string
          format: date-time
          nullable: true
    UnresolvedEvents:
      type: array
      items:
        $ref: '#/components/schemas/Event'
    EndpointStatus:
      type: object
      properties:
        endpointId:
          type: string
        eventTime:
          type: string
          format: date-time
        failedEvents:
          type: array
          items:
            type: string
        pendingEvents:
          type: array
          items:
            type: string
        deferredEvents:
          type: array
          items:
            type: string
        enrichedUnresolvedEvents:
          $ref: '#/components/schemas/UnresolvedEvents'
        continuationToken:
          type: string
        unsupportedEvents:
          type: array
          items:
            type: string
        deadletteredEvents:
          type: array
          items:
            type: string
    MessageErrorContent:
      title: ErrorContent
      type: object
      properties:
        errorText:
          type: string
        errorType:
          type: string
        exceptionStackTrace:
          type: string
        exceptionSource:
          type: string
    EventType:
      title: EventType
      type: object
      required:
        - id
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        namespace:
          type: string
        properties:
          type: array
          items:
            $ref: '#/components/schemas/EventTypeProperty'
        examplePayload:
          type: string
          nullable: true
          description: >-
            The example authored on the event class (its static Example field),
            serialized as indented JSON. Null when the class declares none; the
            client then falls back to a shape-only placeholder.
        producerCount:
          type: integer
        consumerCount:
          type: integer
        producers:
          type: array
          items:
            type: string
        consumers:
          type: array
          items:
            type: string
    EventTypeProperty:
      title: EventTypeProperty
      type: object
      properties:
        name:
          type: string
        typeName:
          type: string
        typeFullName:
          type: string
        description:
          type: string
        isRequired:
          type: boolean
    EventTypeDetails:
      title: EventTypeDetails
      type: object
      properties:
        eventType:
          $ref: '#/components/schemas/EventType'
        codeRepoLink:
          type: string
        producers:
          type: array
          items:
            type: string
        consumers:
          type: array
          items:
            type: string
    FakeEventPayload:
      title: FakeEventPayload
      type: object
      description: >-
        Response shape for GET /api/event-types/{eventtypeid}/fake. The
        payload field is a fully-formed JSON string (indented), not a
        structured object — the client inserts it verbatim into the textarea.
        Null when the type cannot be constructed (abstract, interface, or no
        accessible parameterless constructor).
      properties:
        payload:
          type: string
          nullable: true
          description: Indented JSON payload string, or null when the type cannot be constructed.
    EventTypeGrouping:
      title: EventTypeGrouping
      type: object
      properties:
        namespace:
          type: string
        events:
          type: array
          items:
            $ref: '#/components/schemas/EventType'
    ApplicationStatus:
      title: ApplicationStatus
      type: object
      description: >-
        Deployment status of the management WebApp. Every field is optional and
        is populated only for an authenticated caller; an anonymous caller
        receives an empty status object with all fields null or absent, so the
        anonymous liveness response discloses no deployment detail (GH#93).
      properties:
        env:
          type: string
          nullable: true
          description: >-
            Configured environment name (e.g. "Production"). Populated only for
            authenticated callers; null or absent for anonymous callers.
        nimbusVersion:
          type: string
          nullable: true
          description: >-
            NimBus product version the WebApp runs on (e.g. "3.2.1"). Populated
            only for authenticated callers; null or absent for anonymous callers.
        platformName:
          type: string
          nullable: true
          description: >-
            Name of the platform catalog package that defines the endpoints and
            event types (the assembly name of the loaded IPlatform, e.g.
            "EET.Platform"; "NimBus" for the bundled sample catalog). Populated
            only for authenticated callers; null or absent for anonymous callers.
        platformVersion:
          type: string
          nullable: true
          description: >-
            Version of the platform catalog package named by platformName (e.g.
            "1.0.1"), without any "+<sha>" build suffix. Populated only for
            authenticated callers; null or absent for anonymous callers.
        storageProvider:
          type: string
          nullable: true
          description: >-
            Human-readable name of the active NimBus message-store provider
            (e.g. "Cosmos DB", "SQL Server", "InMemory"). Populated only for
            authenticated callers; null or absent for anonymous callers.
        ticketLinkTemplate:
          type: string
          nullable: true
          description: >-
            URL template for deep-linking reported events to the external
            ticket system, with "{ticket}" as the ticket-id placeholder (e.g.
            "https://support.example.com/browse/{ticket}"). Null or empty when
            no ticket system is configured — the UI then renders a plain
            "Reported" badge without a link. Populated only for authenticated
            callers; null or absent for anonymous callers.
    EndpointStatusCount:
      title: EndpointStatusCount
      type: object
      properties:
        endpointId:
          type: string
        subscriptionStatus:
          type: string
        storageStatus:
          type: string
          description: >
            Marks whether the per-endpoint storage container could be queried.
            "ok" means the counts are accurate. "unavailable" means the
            container/table was missing or unreachable; counts are zero and
            the row should be rendered with a "Storage unavailable" badge.
        eventTime:
          type: string
          format: date-time
        oldestFailureAt:
          type: string
          format: date-time
          nullable: true
          description: >
            When the longest-standing open failure was recorded: the earliest
            last-updated time of a message currently Failed or DeadLettered.
            Null when the endpoint has no open failures or storage is
            unavailable.
        failedCount:
          type: number
        deferredCount:
          type: number
        pendingCount:
          type: number
        unsupportedCount:
          type: number
        deadletterCount:
          type: number
    MonitorAcknowledgement:
      title: MonitorAcknowledgement
