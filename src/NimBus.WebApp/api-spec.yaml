        lastStartTime:
          type: string
          format: date-time
          nullable: true
        lastReceivedTime:
          type: string
          format: date-time
          nullable: true
        lastEndTime:
          type: string
          format: date-time
          nullable: true
        roundTripMs:
          type: integer
          format: int64
          nullable: true
        sdkVersion:
          type: string
          nullable: true
          description: Absent for endpoints on an SDK that predates the heartbeat handler.
    HeartbeatPage:
      title: HeartbeatPage
      type: object
      properties:
        windowDays:
          type: integer
        adaptersReporting:
          type: integer
        adaptersTotal:
          type: integer
        adaptersNeedingAttention:
          type: array
          items:
            type: string
        fleetUptime:
          type: number
          format: double
          nullable: true
        missedBeatsToday:
          type: integer
        adaptersMissingBeatsToday:
          type: integer
        longestGap:
          type: integer
          nullable: true
        adapters:
          type: array
          items:
            $ref: '#/components/schemas/HeartbeatAdapterRow'
        gaps:
          type: array
          items:
            $ref: '#/components/schemas/HeartbeatGapRow'
    HeartbeatAdapterRow:
      title: HeartbeatAdapterRow
      type: object
      properties:
        endpointId:
          type: string
        liveness:
          type: string
          description: 'Current liveness: alive, late, missing or notDeployed.'
        status:
          type: string
          description: 'Last outcome: On, Off, Pending, Unknown or Unsupported.'
        lastBeatUtc:
          type: string
          format: date-time
          nullable: true
        roundTripMs:
          type: integer
          format: int64
          nullable: true
        uptime:
          type: number
          format: double
          nullable: true
        sdkVersion:
          type: string
          nullable: true
        days:
          type: array
          items:
            $ref: '#/components/schemas/HeartbeatDay'
    HeartbeatDay:
      title: HeartbeatDay
      type: object
      properties:
        dayUtc:
          type: string
          format: date-time
        state:
          type: string
          description: 'History state: none, full, partial or gap.'
        missed:
          type: integer
        expected:
          type: integer
        coverage:
          type: number
          format: double
        longestGapSeconds:
          type: integer
    HeartbeatGapRow:
      title: HeartbeatGapRow
      type: object
      properties:
        endpointId:
          type: string
        fromUtc:
          type: string
          format: date-time
        toUtc:
          type: string
          format: date-time
          nullable: true
        durationSeconds:
          type: integer
        ongoing:
          type: boolean
        cause:
          type: string
          nullable: true
    ServiceHealthRow:
      title: ServiceHealthRow
      type: object
      properties:
        serviceId:
          type: string
        status:
          type: string
          description: 'Last settled outcome: On, Off or Unknown. Never Pending.'
        version:
          type: string
          nullable: true
        lastProbeSentUtc:
          type: string
          format: date-time
          nullable: true
        lastSeenUtc:
          type: string
          format: date-time
          nullable: true
        roundTripMs:
          type: integer
          format: int64
          nullable: true
        probeInFlight:
          type: boolean
          description: True while a probe is outstanding. Status keeps the last settled outcome meanwhile.
    HeartbeatEndpointEnabledRequest:
      title: HeartbeatEndpointEnabledRequest
      type: object
      required:
        - enabled
      properties:
        enabled:
          type: boolean
          description: False excludes the endpoint from the fan-out; true opts it back in.
    AuditEntry:
      title: AuditEntry
      type: object
      properties:
        eventId:
          type: string
        endpointId:
          type: string
          nullable: true
        eventTypeId:
          type: string
          nullable: true
        auditorName:
          type: string
        auditTimestamp:
          type: string
          format: date-time
        auditType:
          type: string
          enum:
            - resubmit
            - resubmitWithChanges
            - skip
            - retry
            - comment
            - completeHandoff
            - failHandoff
            - searchEvents
            - getEventDetails
            - getEndpointDetails
            - enableEndpoint
            - disableEndpoint
            - enableEndpointSend
            - disableEndpointSend
            - purgeMessages
            - compose
            - reportEvent
            - grantRole
            - revokeRole
            - manageSubscription
            - updateHeartbeatSettings
            - sendHeartbeatNow
            - enableEndpointHeartbeat
            - disableEndpointHeartbeat
            - deleteStorageContainer
            - reconcileStalePending
            - failureClassified
            - updateIntelligenceSettings
            - updateSimulationSettings
            - controlSimulation
            - updateSimulationConfig
            - acknowledgeEndpoint
            - clearEndpointAcknowledgement
            - updateAuditSettings
            - commandNotSent
            - updateMcpSettings
            - mcpAccessRefused
            - agentApiKeyCreated
            - agentApiKeyRevoked
            - agentApiKeyRemoved
        comment:
          type: string
          nullable: true
        accessDenied:
          type: boolean
          description: >-
            True when the audited action was rejected by the authorization
            layer (the user attempted the action without permission).
        data:
          type: string
          nullable: true
          description: >-
            Optional structured context for the action (search filter JSON,
            resubmit-with-changes body, report toggle, ...).
        createdAt:
          type: string
          format: date-time
    AgentCatalog:
      title: AgentCatalog
      type: object
      properties:
        endpoints:
          type: array
          items:
            type: string
        eventTypes:
          type: array
          items:
            $ref: '#/components/schemas/EventTypeInfo'
    EventTypeInfo:
      title: EventTypeInfo
      type: object
      properties:
        eventTypeId:
          type: string
        name:
          type: string
        jsonSchema:
          type: string
        description:
          type: string
    DefineEventTypeRequest:
      title: DefineEventTypeRequest
      type: object
      required:
        - eventTypeId
        - jsonSchema
      properties:
        eventTypeId:
          type: string
        name:
          type: string
        jsonSchema:
          type: string
        description:
          type: string
        sessionKeyPath:
          type: string
    AgentSubscribeRequest:
      title: AgentSubscribeRequest
      type: object
      required:
        - eventTypeId
      properties:
        eventTypeId:
          type: string
    HandoffCoordinates:
      title: HandoffCoordinates
      type: object
      properties:
        eventId:
          type: string
        sessionId:
          type: string
        messageId:
          type: string
        eventTypeId:
          type: string
        correlationId:
          type: string
        originatingMessageId:
          type: string
    AgentReceivedMessage:
      title: AgentReceivedMessage
      type: object
      properties:
        eventTypeId:
          type: string
        payload:
          type: string
        coordinates:
          $ref: '#/components/schemas/HandoffCoordinates'
    AgentPublishRequest:
      title: AgentPublishRequest
      type: object
      required:
        - eventTypeId
        - payload
      properties:
        eventTypeId:
          type: string
        payload:
          type: string
        sessionId:
          type: string
    AgentSettleRequest:
      title: AgentSettleRequest
      type: object
      required:
        - coordinates
        - outcome
      properties:
        coordinates:
          $ref: '#/components/schemas/HandoffCoordinates'
        outcome:
          type: string
          enum:
            - complete
            - fail
        result:
          type: string
        errorText:
          type: string
        errorType:
          type: string
