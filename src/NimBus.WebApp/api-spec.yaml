openapi: 3.0.0
info:
  title: EIP Management Web API
  description: HTTP API for inspecting and interacting with EIP endpoints and events
  version: 0.0.1
servers:
  - url: 'https://localhost:5001'
    description: Local
paths:
  /api/endpoint/status/count:
    get:
      summary: Get current status of all endpoints
      description: Return an array of endpoint statuses.
      responses:
        '200':
          description: Successfully returned endpoint statuses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EndpointStatusCount'
      operationId: get-endpoint-status-count-all
      tags:
        - Endpoint
    post:
      summary: Get current status of specific endpoints
      operationId: post-api-endpoint-status-count
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EndpointStatusCount'
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
        description: ''
      tags:
        - Endpoint
  '/api/endpoint/{endpointName}/status/':
    get:
      parameters:
        - in: path
          name: endpointName
          schema:
            type: string
          required: true
          description: Name of the endpoint
      summary: Get endpoint status
      description: Return the endpoint status for given endpointName.
      tags:
        - Endpoint
      responses:
        '200':
          description: 'Dictionary of all the Unresolved Events for the endpoint, or an empty object if no Unresolved Events.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnresolvedEvents'
        '404':
          description: Endpoint not found
          content:
            text/string:
              schema:
                type: string
      operationId: get-endpoint-status-id
  '/api/event/{eventId}/{messageId}':
    parameters:
      - schema:
          type: string
        name: eventId
        in: path
        required: true
      - schema:
          type: string
        name: messageId
        in: path
        required: true
    get:
      summary: Get event message by ID
      tags:
        - Event
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
      operationId: get-event-ids
  '/api/event/unresolved/{endpointId}/{eventId}/{sessionId}':
    parameters:
      - schema:
          type: string
        name: endpointId
        in: path
        required: true
      - schema:
          type: string
        name: eventId
        in: path
        required: true
      - schema:
          type: string
        name: sessionId
        in: path
        required: true
    get:
      summary: Get unresolved failed event
      tags:
        - Event
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
      operationId: get-unresolved-failed-event-id
  /api/event-types:
    get:
      summary: GetEventTypes
      tags:
        - EventType
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventType'
      operationId: get-event-types
  '/api/event-types/{eventtypeid}':
    parameters:
      - schema:
          type: string
        name: eventtypeid
        in: path
        required: true
    get:
      summary: Get event type details by ID
      tags:
        - EventType
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventTypeDetails'
      operationId: get-eventtypes-eventtypeid
  '/api/event-types/{eventtypeid}/fake':
    parameters:
      - schema:
          type: string
        name: eventtypeid
        in: path
        required: true
    get:
      summary: Generate a randomized, schema-valid fake payload for the event type
      description: >-
        Reflects over the registered CLR type and produces a randomized JSON
        payload that is guaranteed to deserialize as the type and satisfy the
        type's own IEvent.TryValidate rules (the same gate the Compose /
        Resubmit-with-changes submit path applies). Returns the example
        payload as a safe fallback when no randomized variant validates inside
        the retry budget; returns payload=null only when the type cannot be
        constructed.
      tags:
        - EventType
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FakeEventPayload'
        '404':
          description: Event type not found
      operationId: get-eventtypes-eventtypeid-fake
  '/api/event/resubmit/{eventId}/{messageId}':
    parameters:
      - schema:
          type: string
        name: eventId
        in: path
        required: true
      - schema:
          type: string
        name: messageId
        in: path
        required: true
    post:
      summary: ''
      operationId: post-resubmit-event-ids
      responses:
        '200':
          description: OK
        '404':
          description: Event not found
        '409':
          description: >-
            The message changed since it was loaded (it was resubmitted, skipped
            or failed again), or its current state does not allow the command.
            Nothing was sent.
        '503':
          description: >-
            The audit log could not record the command, so it was not run.
      tags:
        - Event
  '/api/event/skip/{eventId}/{messageId}':
    parameters:
      - schema:
          type: string
        name: eventId
        in: path
        required: true
      - schema:
          type: string
        name: messageId
        in: path
        required: true
    post:
      summary: ''
      operationId: post-skip-event-ids
      responses:
        '200':
          description: OK
        '404':
          description: Event not found
        '409':
          description: >-
            The message changed since it was loaded (it was resubmitted, skipped
            or failed again), or its current state does not allow the command.
            Nothing was sent.
        '503':
          description: >-
            The audit log could not record the command, so it was not run.
      tags:
        - Event
  '/api/event/handoff/complete/{endpointId}/{eventId}/{messageId}':
    parameters:
      - schema:
          type: string
        name: endpointId
        in: path
        required: true
      - schema:
          type: string
        name: eventId
        in: path
        required: true
      - schema:
          type: string
        name: messageId
        in: path
        required: true
    post:
      summary: Complete a pending handoff
      description: >-
        Settle a message parked in the PendingHandoff state as Completed by
        publishing a HandoffCompletedRequest to the owning subscriber endpoint
        on the operator's behalf. The optional note is written to the audit log.
      operationId: post-handoff-complete
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteHandoffRequest'
      responses:
        '200':
          description: OK
        '400':
          description: Event is not a pending handoff
        '404':
          description: Endpoint or event not found
      tags:
        - Event
  '/api/event/handoff/fail/{endpointId}/{eventId}/{messageId}':
    parameters:
      - schema:
          type: string
        name: endpointId
        in: path
        required: true
      - schema:
          type: string
        name: eventId
        in: path
        required: true
      - schema:
          type: string
        name: messageId
        in: path
        required: true
    post:
      summary: Fail a pending handoff
      description: >-
        Settle a message parked in the PendingHandoff state as Failed by
        publishing a HandoffFailedRequest to the owning subscriber endpoint on
        the operator's behalf. The required reason surfaces on the resulting
        Failed audit row and is written to the audit log.
      operationId: post-handoff-fail
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FailHandoffRequest'
      responses:
        '200':
          description: OK
        '400':
          description: Event is not a pending handoff, or reason is missing
        '404':
          description: Endpoint or event not found
      tags:
        - Event
  '/api/endpoint/status/{endpointName}':
    parameters:
      - schema:
          type: string
        name: endpointName
        in: path
        required: true
    get:
      summary: Get paginated endpoint status with events
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointStatus'
      operationId: get-api-endpointstatus-status-endpointName
      tags:
        - Endpoint
      description: Returns detailed endpoint status including enriched unresolved events with pagination support.
  '/api/event/details/{endpoint}/{id}':
    parameters:
      - schema:
          type: string
        name: id
        in: path
        required: true
      - schema:
          type: string
        name: endpoint
        in: path
        required: true
    get:
      summary: Your GET endpoint
      tags:
        - Event
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetails'
      operationId: get-event-details-id
  '/api/event/data/{endpoint}/{id}':
    parameters:
      - schema:
          type: string
        name: id
        in: path
        required: true
      - schema:
          type: string
        name: endpoint
        in: path
        required: true
    get:
      summary: Get a single event by endpoint and event id
      description: Returns the unresolved event document for the given endpoint and event id, regardless of the active storage provider.
      tags:
        - Event
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '404':
          description: Endpoint or event not found
      operationId: get-event-id
  '/api/event-types/endpoint/{endpointId}':
    parameters:
      - schema:
          type: string
        name: endpointId
        in: path
        required: true
    get:
      summary: Your GET endpoint
      tags:
        - EventType
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  produces:
                    type: array
                    items:
                      $ref: '#/components/schemas/EventTypeGrouping'
                  consumes:
                    type: array
                    items:
                      $ref: '#/components/schemas/EventTypeGrouping'
                  eventTypeDetails:
                    type: array
                    items:
                      $ref: '#/components/schemas/EventTypeDetails'
              examples: {}
      operationId: get-eventtypes-by-endpoint-id
  '/api/event/change/{eventId}/{messageId}':
    parameters:
      - schema:
          type: string
        name: eventId
        in: path
        required: true
      - schema:
          type: string
        name: messageId
        in: path
        required: true
    post:
      summary: ''
      operationId: post-resubmit-with-changes-event-ids
      responses:
        '200':
          description: OK
        '404':
          description: Event not found
        '409':
          description: >-
            The message changed since it was loaded (it was resubmitted, skipped
            or failed again), or its current state does not allow the command.
            Nothing was sent.
        '503':
          description: >-
            The audit log could not record the command, so it was not run.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResubmitWithChanges'
      description: ''
      tags:
        - Event
  /api/app/stats:
    get:
      summary: Get application status and version
      description: >-
        Answers anonymously so liveness probes and status monitors work without
        credentials, but every ApplicationStatus field is populated only for an
        authenticated caller — an anonymous caller gets an empty status object,
        so the response discloses nothing about the deployment.
      tags:
        - Application
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationStatus'
      operationId: get-api-app-stats
  /api/endpoint/endpoints:
    get:
      summary: Get all endpoint IDs
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
      operationId: get-endpoints-all
      tags:
        - Endpoint
  '/api/endpoint/{endpointName}/status/count':
    parameters:
      - schema:
          type: string
        name: endpointName
        in: path
        required: true
    get:
      summary: Get EndpointStatus Count
      tags:
        - Endpoint
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointStatusCount'
      operationId: get-endpoint-status-count-id
  '/api/endpoint/{endpointName}/status/continuationToken':
    parameters:
      - schema:
          type: string
        name: endpointName
        in: path
        required: true
    post:
      summary: Your POST endpoint
      tags:
        - Endpoint
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointStatus'
      operationId: post-endpoint-status-id-token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContinuationToken'
  '/api/event/details/{endpointId}/{id}/logs':
    parameters:
      - schema:
          type: string
        name: id
        in: path
        required: true
      - schema:
          type: string
        name: endpointId
        in: path
        required: true
    get:
      summary: Your GET endpoint
      tags:
        - Event
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventLogEntry'
      operationId: get-event-details-logs-id
  '/api/event/details/{endpointId}/{id}/history':
    parameters:
      - schema:
          type: string
        name: id
        in: path
        required: true
      - schema:
          type: string
        name: endpointId
        in: path
        required: true
    get:
      summary: Your GET endpoint
      tags:
        - Event
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
      operationId: get-event-details-history-id
  '/api/endpoint/{endpointId}/session/{sessionId}':
    parameters:
      - schema:
          type: string
        name: endpointId
        in: path
        required: true
      - schema:
          type: string
        name: sessionId
        in: path
        required: true
    get:
      summary: Your GET endpoint
      tags:
        - Endpoint
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatus'
      operationId: get-endpoint-session-id
  '/api/endpoint/{endpointId}/sessions/batch':
    parameters:
      - schema:
          type: string
        name: endpointId
        in: path
        required: true
    post:
      summary: Get session status for multiple sessions in batch
      operationId: post-endpoint-sessions-batch
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionStatus'
        '404':
          description: Endpoint not found
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
        description: Array of session IDs to query
      tags:
        - Endpoint
  '/api/storagehook/cosmos/{endpointId}':
    parameters:
      - schema:
          type: string
        name: endpointId
        in: path
        required: true
    post:
      summary: ''
      description: >-
        Storage-hook webhook for endpoint state changes. The path keeps its historical
        "cosmos" segment because Event Grid subscriptions and the Resolver notifier post
        to it; it serves every storage provider.
      operationId: storagehook-receive
      responses:
        '200':
          description: OK
      tags:
        - StorageHook
  '/api/storagehook/heartbeat/{endpointId}':
    parameters:
      - schema:
          type: string
        name: endpointId
        in: path
        required: true
    post:
      summary: Notify operators that an endpoint's heartbeat state changed
      description: Called by the Resolver after it settles a heartbeat. Authenticated with the shared webhook key.
      operationId: post-storagehook-heartbeat
      responses:
        '200':
          description: OK
        '400':
          description: Unknown endpoint
        '401':
          description: Missing or invalid webhook key
      tags:
        - StorageHook
  '/api/storagehook/servicehealth/{serviceId}':
    parameters:
      - schema:
          type: string
        name: serviceId
        in: path
        required: true
    post:
      summary: Notify operators that a platform service's liveness changed
      description: >-
        Called by the Resolver after it answers a liveness probe. Only the
        Resolver service id is accepted — "Resolver" is not an endpoint, so the
        heartbeat hook's catalog check would reject it.
      operationId: post-storagehook-servicehealth
      responses:
        '200':
          description: OK
        '400':
          description: Unknown service
        '401':
          description: Missing or invalid webhook key
      tags:
        - StorageHook
  '/api/event/audit/{eventId}':
    parameters:
      - schema:
          type: string
        name: eventId
        in: path
        required: true
    get:
      summary: Your GET endpoint
      tags:
        - Event
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MessageAudit'
        '404':
          description: Event not found
      operationId: get-message-audits-event-id
    post:
      summary: ''
      operationId: post-message-audit
      responses:
        '200':
          description: OK
      tags:
        - Event
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageAudit'
  '/api/event/deferred/{endpointId}/{eventId}':
    get:
      summary: Inspect deferred tracking and broker presence
      operationId: get-deferred-inspection
      tags: [Event]
      parameters:
        - { name: endpointId, in: path, required: true, schema: { type: string } }
        - { name: eventId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Point-in-time broker inspection and stored processing evidence
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeferredInspection' }
        '403': { description: Reader permission required }
        '404': { description: Endpoint or event not found }
  '/api/event/deferred/{endpointId}/{eventId}/skip-tracking':
    post:
      summary: Skip a stale deferred tracking record without publishing or settling messages
      operationId: post-skip-deferred-tracking
      tags: [Event]
      parameters:
        - { name: endpointId, in: path, required: true, schema: { type: string } }
        - { name: eventId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeferredSkipRequest' }
      responses:
        '200':
          description: Tracking row skipped; audit persistence is reported separately
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeferredSkipResult' }
        '400': { description: Reason and inspected row version required }
        '403': { description: Contributor permission required }
        '404': { description: Endpoint or event not found }
        '409': { description: Row changed or broker inspection does not permit skipping }
        '501': { description: Storage provider does not support conditional recovery }
  '/api/event/reprocess-deferred/{endpointId}/{sessionId}':
    post:
      summary: Reprocess deferred messages for a session
      operationId: post-reprocess-deferred
      tags:
        - Event
      parameters:
        - schema:
            type: string
          name: endpointId
          in: path
          required: true
        - schema:
            type: string
          name: sessionId
          in: path
          required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeferredReprocessResult'
        '404':
          description: Endpoint not found
  /api/me:
    get:
      summary: Get current user info
      operationId: get-me
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'
      tags:
        - Application
  /api/event/compose-new:
    post:
      summary: Your POST endpoint
      operationId: post-compose-new-event
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
      tags:
        - Event
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResubmitWithChanges'
  '/api/event/blocked/{endpointId}/{sessionId}':
    parameters:
      - schema:
          type: string
        name: endpointId
        in: path
        required: true
      - schema:
          type: string
        name: sessionId
        in: path
        required: true
    get:
      summary: Get blocked events on a session (paginated)
      description: Returns the page of pending and deferred events that are blocking the given session. Server clamps `take` to [1, 200] with a default of 50.
      tags:
        - Event
      parameters:
        - name: skip
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: take
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockedEventsPage'
        '404':
          description: Not Found
      operationId: get-event-blocked-id
  '/api/event/pending/{endpointId}':
    parameters:
      - schema:
          type: string
        name: endpointId
        in: path
        required: true
    get:
      summary: Your GET endpoint
      tags:
        - Event
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
              examples:
                UnresolveEvent:
                  value:
                    - originatingId: string
                      eventId: string
                      status: string
        '404':
          description: Not Found
      operationId: get-event-pending-id
  '/api/endpoint/{endpointId}/subscribe':
    parameters:
      - schema:
          type: string
        name: endpointId
        in: path
        required: true
    post:
      summary: ''
      operationId: post-endpoint-subscribe
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
      tags:
        - Endpoint
      description: ''
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EndpointSubscription'
    get:
      summary: ''
      operationId: get-endpoint-subscribe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EndpointSubscription'
        '404':
          description: Not Found
      tags:
        - Endpoint
      description: Get all subscribers to given endpoint
    delete:
      summary: ''
      operationId: delete-endpoint-subscribe
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionAuthor'
            examples: {}
      tags:
        - Endpoint
  '/api/endpoint/{endpointName}/purge':
    parameters:
      - schema:
          type: string
        name: endpointName
        in: path
        required: true
    post:
      summary: ''
      operationId: post-endpoint-purge
      responses:
        '200':
          description: OK
        '404':
          description: Not Found
      description: Remove all messages on endpoint
      tags:
        - Endpoint
  '/api/endpoint/{endpointId}/subscriptionstatus':
    parameters:
      - schema:
          type: string
        name: endpointId
        in: path
        required: true
    post:
      summary: ''
      operationId: post-endpoint-subscriptionstatus
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
      tags:
        - Endpoint
      description: ''
      requestBody:
        content:
          application/json:
            schema:
              type: string
            examples:
              example-12:
                value: string
    get:
      summary: ''
      operationId: get-endpoint-subscriptionstatus
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: string
        '404':
          description: Not Found
      tags:
        - Endpoint
      description: Get status for given subscription on endpoint
  '/api/endpoint/{endpointId}/sendstatus':
    parameters:
      - schema:
          type: string
        name: endpointId
        in: path
        required: true
    post:
      summary: ''
      operationId: post-endpoint-sendstatus
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
      tags:
        - Endpoint
